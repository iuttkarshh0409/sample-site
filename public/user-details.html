<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Auth - Onboarding Profile Directory</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Outfit', sans-serif;
      --bg-color: hsl(230, 40%, 6%);
      --card-bg: hsla(230, 35%, 12%, 0.45);
      --card-border: hsla(230, 30%, 90%, 0.08);
      --text-primary: hsl(210, 40%, 96%);
      --text-secondary: hsl(215, 20%, 68%);
      --text-muted: hsl(215, 15%, 45%);
      --primary-glow: linear-gradient(135deg, hsl(270, 80%, 55%) 0%, hsl(190, 95%, 50%) 100%);
      --primary-hover: linear-gradient(135deg, hsl(270, 85%, 60%) 0%, hsl(190, 100%, 55%) 100%);
      --color-success: hsl(145, 80%, 45%);
      --color-error: hsl(355, 85%, 60%);
      --color-info: hsl(200, 85%, 50%);
      --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 20px;
      overflow-y: auto;
      position: relative;
    }

    /* Background Glows */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }
    .bg-glow-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, hsla(270, 80%, 55%, 0.15) 0%, transparent 70%);
      top: -10%;
      right: -5%;
    }
    .bg-glow-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, hsla(190, 95%, 50%, 0.15) 0%, transparent 70%);
      bottom: -15%;
      left: -10%;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 20px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff 40%, hsl(210, 40%, 80%) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      font-size: 0.9rem;
      color: hsl(190, 95%, 50%);
      text-decoration: none;
      transition: var(--transition-smooth);
    }
    .back-link:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-bottom: 24px;
      display: none;
    }
    .alert.success {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: var(--color-success);
    }
    .alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--color-error);
    }

    /* Layout panels */
    .panel-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 850px) {
      .panel-grid {
        grid-template-columns: 1.6fr 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 10px;
      color: #fff;
    }

    /* Directory Table */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    td {
      font-size: 0.88rem;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      color: var(--text-secondary);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
      color: #fff;
    }

    /* Action Links */
    .action-btn {
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      margin-right: 12px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .action-view {
      color: hsl(190, 95%, 50%);
    }
    .action-view:hover {
      text-decoration: underline;
    }
    .action-delete {
      color: var(--color-error);
    }
    .action-delete:hover {
      text-decoration: underline;
    }

    /* Details Panel */
    .placeholder-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 40px 0;
    }

    .detail-group {
      margin-bottom: 14px;
    }
    .detail-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: block;
    }
    .detail-value {
      font-size: 0.9rem;
      color: var(--text-primary);
      background: hsla(230, 20%, 5%, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      word-break: break-all;
    }
    .detail-sub-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 20px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="container">
    <header class="header-bar">
      <h1 class="title">Profile Onboarding Directory</h1>
      <a href="/login" class="back-link">← Go to Login Page</a>
    </header>

    <div id="alert-banner" class="alert"></div>

    <div class="panel-grid">
      <!-- Left Panel: Directory Table -->
      <div class="card">
        <h2 class="card-title">Completed User Profiles</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Designation</th>
                <th>Bank Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="directory-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Right Panel: View Specific Details -->
      <div class="card">
        <h2 class="card-title">Profile Inspection Card</h2>
        <div id="details-panel-content">
          <div class="placeholder-text">Click "View Profile" on any user to inspect their completed onboarding details.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const directoryTbody = document.getElementById('directory-tbody');
      const detailsPanelContent = document.getElementById('details-panel-content');
      const alertBanner = document.getElementById('alert-banner');

      // Fetch all profile details
      async function loadDirectory() {
        try {
          const res = await fetch('/api/user-details');
          const result = await res.json();
          if (!res.ok) throw new Error(result.message || 'Failed to fetch onboarding directory.');

          renderTable(result.data || []);
        } catch (err) {
          showAlert(err.message, 'error');
        }
      }

      function renderTable(list) {
        if (list.length === 0) {
          directoryTbody.innerHTML = `
            <tr>
              <td colspan="5" class="placeholder-text" style="text-align: center;">No onboarding profiles found.</td>
            </tr>
          `;
          return;
        }

        directoryTbody.innerHTML = list.map(item => `
          <tr>
            <td>#${item.user_id}</td>
            <td><strong>${escapeHTML(item.name)}</strong></td>
            <td>${escapeHTML(item.designation)}</td>
            <td>${escapeHTML(item.bank_name)}</td>
            <td>
              <button class="action-btn action-view" data-id="${item.id}">View Profile</button>
              <button class="action-btn action-delete" data-id="${item.id}">Delete</button>
            </td>
          </tr>
        `).join('');

        // Attach event listeners
        document.querySelectorAll('.action-view').forEach(btn => {
          btn.addEventListener('click', () => viewDetails(btn.dataset.id));
        });
        document.querySelectorAll('.action-delete').forEach(btn => {
          btn.addEventListener('click', () => deleteDetails(btn.dataset.id));
        });
      }

      // View details of a specific record
      async function viewDetails(id) {
        try {
          const res = await fetch(`/api/user-details/${id}`);
          const result = await res.json();
          if (!res.ok) throw new Error(result.message || 'Failed to fetch details.');

          const profile = result.data;
          
          detailsPanelContent.innerHTML = `
            <div class="detail-sub-title">Personal Info</div>
            <div class="detail-group">
              <span class="detail-label">Name</span>
              <div class="detail-value">${escapeHTML(profile.name)}</div>
            </div>
            <div class="detail-group">
              <span class="detail-label">Designation</span>
              <div class="detail-value">${escapeHTML(profile.designation)}</div>
            </div>
            <div class="detail-group">
              <span class="detail-label">Mobile Number</span>
              <div class="detail-value">${escapeHTML(profile.mobile_number)}</div>
            </div>
            <div class="detail-group">
              <span class="detail-label">Permanent Address</span>
              <div class="detail-value">${escapeHTML(profile.permanent_address)}</div>
            </div>

            <div class="detail-sub-title">Bank Details</div>
            <div class="detail-group">
              <span class="detail-label">Bank Name</span>
              <div class="detail-value">${escapeHTML(profile.bank_name)}</div>
            </div>
            <div class="detail-group">
              <span class="detail-label">Branch Address</span>
              <div class="detail-value">${escapeHTML(profile.bank_address)}</div>
            </div>
            <div class="detail-group">
              <span class="detail-label">Account Number (Masked)</span>
              <div class="detail-value">${escapeHTML(profile.bank_account_number)}</div>
            </div>
            <div class="detail-group">
              <span class="detail-label">IFSC Code</span>
              <div class="detail-value">${escapeHTML(profile.ifsc_code)}</div>
            </div>

            <div class="detail-sub-title">Identity Verification</div>
            <div class="detail-group">
              <span class="detail-label">Aadhar Number (Masked)</span>
              <div class="detail-value">${escapeHTML(profile.aadhar_number)}</div>
            </div>
          `;
        } catch (err) {
          showAlert(err.message, 'error');
        }
      }

      // Delete details record
      async function deleteDetails(id) {
        if (!confirm('Are you sure you want to delete this onboarding profile? The user will be required to re-complete onboarding on their next login.')) {
          return;
        }

        try {
          const res = await fetch(`/api/user-details/${id}`, { method: 'DELETE' });
          const result = await res.json();
          if (!res.ok) throw new Error(result.message || 'Failed to delete record.');

          showAlert('Profile details deleted successfully.', 'success');
          detailsPanelContent.innerHTML = `
            <div class="placeholder-text">Click "View Profile" on any user to inspect their completed onboarding details.</div>
          `;
          loadDirectory();
        } catch (err) {
          showAlert(err.message, 'error');
        }
      }

      function showAlert(msg, type) {
        alertBanner.textContent = msg;
        alertBanner.className = `alert ${type}`;
        setTimeout(() => {
          alertBanner.style.display = 'none';
        }, 4000);
      }

      function escapeHTML(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Init
      loadDirectory();
    });
  </script>
</body>
</html>
